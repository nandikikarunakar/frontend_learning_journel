<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AVL Tree — Insertion & Deletion Animation</title>
<style>
  :root{
    --bg:#ffc743; --panel:#171a22; --panel2:#1e2230; --line:#2b3040;
    --text:#e7e9ee; --muted:#8b91a5; --accent:#5b8cff; --accent2:#38d9a9;
    --warn:#ffb020; --danger:#ff5d5d; --node:#242a3b; --nodeStroke:#3d4560;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:20px;
  }
  h1{font: size 26px; font-weight:600; margin:0 0 4px; text-align:center;}
  .sub{color:var(--muted); font-size:22px; margin-bottom:16px;color:rgb(231, 11, 11);font-weight:bold;}
  .wrap{width:100%; max-width:980px;}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:14px;
  }
  .controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  input[type=number]{
    width:80px; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:14px;
  }
  button{
    padding:8px 14px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:13px; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button:hover{background:#262c3f; border-color:#3a4260;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.primary:hover{background:#4a78e6;}
  button.danger{border-color:#5a2d2d;}
  button.danger:hover{background:#f3062d;}
  .spacer{flex:1;}
  .divider{width:1px; height:26px; background:var(--line); margin:0 4px;}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  label{font-size:12px; color:var(--muted);}
  #svgHost{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    display:block; min-height:340px;
  }
  .status{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; font-size:14px; min-height:22px; display:flex; align-items:center; gap:10px;
  }
  .status .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none;}
  .playback{display:flex; align-items:center; gap:8px;}
  input[type=range]{accent-color:var(--accent); width:140px;}
  .keyText{fill:#e7e9ee; font-size:15px; font-weight:600; text-anchor:middle; dominant-baseline:central; font-family:inherit;}
  .bfText{fill:#8b91a5; font-size:10px; text-anchor:middle; dominant-baseline:central; font-family:inherit;}
  .legend{display:flex; gap:16px; font-size:12px; color:var(--muted); margin-top:8px; flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .sw{width:12px; height:12px; border-radius:3px; display:inline-block;}
</style>
</head>
<body>
<div class="wrap">
  <h1>AVL tree — insertion & deletion </h1>
  <div class="sub">Nandiki Karunakar</div>

  <div class="panel">
    <div class="controls">
      <input type="number" id="valInput" placeholder="value" />
      <button class="primary" id="insertBtn">Insert</button>
      <button class="danger" id="deleteBtn">Delete</button>
      <div class="divider"></div>
      <button id="randomBtn">Random tree</button>
      <button id="clearBtn">Clear</button>
      <div class="spacer"></div>
      <div class="playback">
        <label>Speed</label>
        <input type="range" id="speed" min="1" max="4" value="2" step="1">
        <button id="prevBtn" title="Previous step">⏮</button>
        <button id="playBtn" title="Play / pause">▶</button>
        <button id="nextBtn" title="Next step">⏭</button>
      </div>
    </div>
  </div>

  <svg id="svgHost" viewBox="0 0 940 400"></svg>

  <div class="status" style="margin-top:14px;">
    <div class="dot" id="statusDot"></div>
    <div id="statusText">Insert or delete a value to begin. Try "Random tree" to get started quickly.</div>
  </div>

  <div class="legend">
    <span><i class="sw" style="background:#5b8cff"></i>node being compared</span>
    <span><i class="sw" style="background:#38d9a9"></i>inserted / found node</span>
    <span><i class="sw" style="background:#ffb020"></i>rotation pivot</span>
    <span><i class="sw" style="background:#ff5d5d"></i>deleted node</span>
  </div>
</div>

<script>
/* ---------- AVL core ---------- */
let idCounter = 1;
function newNode(key){
  return { id: idCounter++, key, left:null, right:null, height:1 };
}
function h(n){ return n ? n.height : 0; }
function bf(n){ return n ? h(n.left) - h(n.right) : 0; }
function updateHeight(n){ n.height = 1 + Math.max(h(n.left), h(n.right)); }

function rotateRight(y){
  const x = y.left;
  const t2 = x.right;
  x.right = y;
  y.left = t2;
  updateHeight(y);
  updateHeight(x);
  return x;
}
function rotateLeft(x){
  const y = x.right;
  const t2 = y.left;
  y.left = x;
  x.right = t2;
  updateHeight(x);
  updateHeight(y);
  return y;
}

/* deep clone for step snapshots */
function clone(n){
  if(!n) return null;
  return { id:n.id, key:n.key, height:n.height, left:clone(n.left), right:clone(n.right) };
}

let root = null;
let steps = [];

function pushStep(msg, opts){
  steps.push({
    tree: clone(root),
    msg,
    compare: (opts && opts.compare) || null,
    good: (opts && opts.good) || null,
    pivot: (opts && opts.pivot) || null,
    bad: (opts && opts.bad) || null
  });
}

function insertAVL(node, key){
  if(!node){
    const n = newNode(key);
    root = root === null ? n : root;
    return n;
  }
  pushStep(`Comparing ${key} with ${node.key}`, {compare:node.id});
  if(key < node.key){
    node.left = insertAVL(node.left, key);
  } else if(key > node.key){
    node.right = insertAVL(node.right, key);
  } else {
    pushStep(`${key} already exists — no duplicates allowed`, {bad:node.id});
    return node;
  }
  updateHeight(node);
  const balance = bf(node);
  pushStep(`Updated height of ${node.key} → balance factor ${balance}`, {compare:node.id});

  if(balance > 1 && key < node.left.key){
    pushStep(`Balance factor ${balance} at ${node.key} — Left Left case, rotating right`, {pivot:node.id});
    return rotateRight(node);
  }
  if(balance < -1 && key > node.right.key){
    pushStep(`Balance factor ${balance} at ${node.key} — Right Right case, rotating left`, {pivot:node.id});
    return rotateLeft(node);
  }
  if(balance > 1 && key > node.left.key){
    pushStep(`Balance factor ${balance} at ${node.key} — Left Right case, rotating left then right`, {pivot:node.id});
    node.left = rotateLeft(node.left);
    return rotateRight(node);
  }
  if(balance < -1 && key < node.right.key){
    pushStep(`Balance factor ${balance} at ${node.key} — Right Left case, rotating right then left`, {pivot:node.id});
    node.right = rotateRight(node.right);
    return rotateLeft(node);
  }
  return node;
}

function minValueNode(node){
  let cur = node;
  while(cur.left) cur = cur.left;
  return cur;
}

function deleteAVL(node, key){
  if(!node) return null;
  pushStep(`Comparing ${key} with ${node.key}`, {compare:node.id});
  if(key < node.key){
    node.left = deleteAVL(node.left, key);
  } else if(key > node.key){
    node.right = deleteAVL(node.right, key);
  } else {
    pushStep(`Found ${key} — removing it`, {bad:node.id});
    if(!node.left || !node.right){
      const temp = node.left ? node.left : node.right;
      if(!temp){
        node = null;
      } else {
        node = temp;
      }
    } else {
      const succ = minValueNode(node.right);
      pushStep(`Node has two children — replacing ${key} with inorder successor ${succ.key}`, {good:succ.id});
      node.key = succ.key;
      node.id = node.id;
      node.right = deleteAVL(node.right, succ.key);
    }
  }
  if(!node) return null;
  updateHeight(node);
  const balance = bf(node);
  pushStep(`Updated height of ${node.key} → balance factor ${balance}`, {compare:node.id});

  if(balance > 1 && bf(node.left) >= 0){
    pushStep(`Balance factor ${balance} at ${node.key} — Left Left case, rotating right`, {pivot:node.id});
    return rotateRight(node);
  }
  if(balance > 1 && bf(node.left) < 0){
    pushStep(`Balance factor ${balance} at ${node.key} — Left Right case, rotating left then right`, {pivot:node.id});
    node.left = rotateLeft(node.left);
    return rotateRight(node);
  }
  if(balance < -1 && bf(node.right) <= 0){
    pushStep(`Balance factor ${balance} at ${node.key} — Right Right case, rotating left`, {pivot:node.id});
    return rotateLeft(node);
  }
  if(balance < -1 && bf(node.right) > 0){
    pushStep(`Balance factor ${balance} at ${node.key} — Right Left case, rotating right then left`, {pivot:node.id});
    node.right = rotateRight(node.right);
    return rotateLeft(node);
  }
  return node;
}

/* ---------- layout ---------- */
const svgNS = "http://www.w3.org/2000/svg";
const host = document.getElementById('svgHost');
const RADIUS = 20;
const VW = 940;

function computeLayout(tree){
  const positions = {};
  let xCounter = 0;
  function assign(node, depth){
    if(!node) return;
    assign(node.left, depth+1);
    positions[node.id] = { x: xCounter, y: depth, key: node.key, left: node.left?node.left.id:null, right: node.right?node.right.id:null };
    xCounter++;
    assign(node.right, depth+1);
  }
  assign(tree, 0);
  const count = xCounter || 1;
  const spacing = Math.max(56, Math.min(90, (VW-80)/count));
  const startX = (VW - (count-1)*spacing)/2;
  Object.values(positions).forEach(p=>{
    p.px = startX + p.x*spacing;
    p.py = 50 + p.y*72;
  });
  return positions;
}

function render(step){
  const positions = computeLayout(step.tree);
  const maxY = Object.values(positions).reduce((m,p)=>Math.max(m,p.py), 40);
  host.setAttribute('viewBox', `0 0 ${VW} ${maxY+70}`);

  // build edges
  const edges = [];
  Object.values(positions).forEach(p=>{
    if(p.left && positions[p.left]) edges.push([p, positions[p.left]]);
    if(p.right && positions[p.right]) edges.push([p, positions[p.right]]);
  });

  host.innerHTML = '';
  const gEdges = document.createElementNS(svgNS,'g');
  edges.forEach(([a,b])=>{
    const line = document.createElementNS(svgNS,'line');
    line.setAttribute('x1', a.px); line.setAttribute('y1', a.py);
    line.setAttribute('x2', b.px); line.setAttribute('y2', b.py);
    line.setAttribute('stroke', '#3d4560'); line.setAttribute('stroke-width','1.5');
    line.style.transition = 'x1 .5s, y1 .5s, x2 .5s, y2 .5s';
    gEdges.appendChild(line);
  });
  host.appendChild(gEdges);

  const gNodes = document.createElementNS(svgNS,'g');
  Object.entries(positions).forEach(([id,p])=>{
    const nid = Number(id);
    const g = document.createElementNS(svgNS,'g');
    g.setAttribute('transform', `translate(${p.px},${p.py})`);
    g.style.transition = 'transform .5s';

    const circle = document.createElementNS(svgNS,'circle');
    circle.setAttribute('r', RADIUS);
    let fill = '#242a3b', stroke = '#3d4560';
    if(step.compare === nid){ fill='#22335e'; stroke='#5b8cff'; }
    if(step.pivot === nid){ fill='#4a3a17'; stroke='#ffb020'; }
    if(step.good === nid){ fill='#173c33'; stroke='#38d9a9'; }
    if(step.bad === nid){ fill='#4a1f22'; stroke='#ff5d5d'; }
    circle.setAttribute('fill', fill);
    circle.setAttribute('stroke', stroke);
    circle.setAttribute('stroke-width', '2');
    g.appendChild(circle);

    const text = document.createElementNS(svgNS,'text');
    text.setAttribute('class','keyText');
    text.textContent = p.key;
    g.appendChild(text);

    gNodes.appendChild(g);
  });
  host.appendChild(gNodes);
}

/* ---------- playback ---------- */
let curStep = 0;
let playing = false;
let timer = null;

function speedMs(){
  const v = Number(document.getElementById('speed').value);
  return {1:1400, 2:900, 3:550, 4:280}[v];
}

function goto(i){
  if(steps.length===0){ render({tree:root, }); updateStatus('Insert or delete a value to begin.'); return; }
  curStep = Math.max(0, Math.min(steps.length-1, i));
  const s = steps[curStep];
  render(s);
  updateStatus(s.msg, curStep, steps.length);
  document.getElementById('prevBtn').disabled = curStep===0;
  document.getElementById('nextBtn').disabled = curStep===steps.length-1;
}

function updateStatus(msg, idx, total){
  const t = document.getElementById('statusText');
  t.textContent = (idx!==undefined) ? `Step ${idx+1}/${total} — ${msg}` : msg;
}

function play(){
  if(steps.length===0) return;
  playing = true;
  document.getElementById('playBtn').textContent = '⏸';
  clearInterval(timer);
  timer = setInterval(()=>{
    if(curStep >= steps.length-1){ pause(); return; }
    goto(curStep+1);
  }, speedMs());
}
function pause(){
  playing = false;
  document.getElementById('playBtn').textContent = '▶';
  clearInterval(timer);
}

document.getElementById('playBtn').onclick = ()=> playing ? pause() : play();
document.getElementById('prevBtn').onclick = ()=>{ pause(); goto(curStep-1); };
document.getElementById('nextBtn').onclick = ()=>{ pause(); goto(curStep+1); };
document.getElementById('speed').oninput = ()=>{ if(playing){ play(); } };

function runInsert(key){
  steps = [];
  pause();
  root = insertAVL(root, key);
  updateHeight(root);
  pushStep(`Inserted ${key}. Tree is balanced.`, {good: findIdByKey(root,key)});
  curStep = -1;
  goto(0);
  play();
}
function runDelete(key){
  if(!findIdByKey(root,key)){
    updateStatus(`${key} is not in the tree.`);
    return;
  }
  steps = [];
  pause();
  root = deleteAVL(root, key);
  pushStep(`Deleted ${key}. Tree is balanced.`, {});
  curStep = -1;
  goto(0);
  play();
}
function findIdByKey(node, key){
  if(!node) return null;
  if(node.key===key) return node.id;
  return key<node.key ? findIdByKey(node.left,key) : findIdByKey(node.right,key);
}

document.getElementById('insertBtn').onclick = ()=>{
  const v = document.getElementById('valInput').value;
  if(v==='') return;
  runInsert(Number(v));
  document.getElementById('valInput').value='';
};
document.getElementById('deleteBtn').onclick = ()=>{
  const v = document.getElementById('valInput').value;
  if(v==='') return;
  runDelete(Number(v));
  document.getElementById('valInput').value='';
};
document.getElementById('valInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('insertBtn').click();
});
document.getElementById('clearBtn').onclick = ()=>{
  root = null; steps=[]; curStep=0; pause();
  render({tree:null});
  updateStatus('Tree cleared. Insert a value to begin.');
};
document.getElementById('randomBtn').onclick = ()=>{
  root = null;
  const vals = new Set();
  while(vals.size < 8) vals.add(Math.floor(Math.random()*90)+10);
  steps = [];
  [...vals].forEach(v=>{ root = insertAVL(root, v); updateHeight(root); });
  pushStep('Random balanced AVL tree generated.', {});
  curStep = -1;
  goto(steps.length-1);
};

render({tree:null});
</script>
</body>
</html>
