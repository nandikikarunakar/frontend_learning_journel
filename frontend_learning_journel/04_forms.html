<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Login form</title>
  </head>
  <body>
    <h1>Login Form</h1>
    <form>
      <label for="email">
        Email:
        <input placeholder="enter email" type="text" name="email" />
      </label>
      <label for="password">
        Password:
        <input
          placeholder="enter your password"
          type="password"
          name="password"
          id=""
        />
      </label>
      <button type="submit">Login</button>
      <button type="reset">Reset</button>
    </form>
    <div>
      <h2>Learning Form</h2>
      <form>
        <label for="email">
          Email:
          <input type="email" name="email" id="" />
        </label>
        <label for="text">
          feedback:
          <textarea name="" id="" cols="19" rows="6"></textarea>
        </label>
        <button type="submit">Submit</button>
      </form>
    </div>
    <div>
      <h2>Checkbox form</h2>
      <form>
        <label for="Games">
          Cricket <input type="checkbox" name="" id="" />
        </label>
        <label for="Games">
          football <input type="radio" name="" id="" />
        </label>
        <label for="Games">
          <select name="Games" id="">
            <option value="Ruby">Ruby</option>
            <option value="Baseball">Baseball</option>
          </select>
        </label>
        <button type="submit">Submit</button>
        <label for="month">
          <input type="month" name="" id="" />
        </label>
      </form>
    </div>
  </body>
</html>
